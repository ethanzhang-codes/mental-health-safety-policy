<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.t{font-size:19px;font-weight:600}.s{font-size:15px}.n{font-size:13px;fill:#555}.box{stroke:#333;stroke-width:1.5;rx:10}.flow{fill:none;stroke:#444;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.group{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:7 5;rx:14}
    </style>
  </defs>
  <rect width="1600" height="760" fill="white"/>

  <rect class="box" x="35" y="300" width="205" height="75" fill="#DCEEFF"/><text class="t" x="138" y="330" text-anchor="middle">Ordered user turns</text><text class="s" x="138" y="355" text-anchor="middle">x(t−h+1), …, x(t)</text>
  <text class="n" x="138" y="400" text-anchor="middle">current and previous turns only</text>

  <rect class="group" x="275" y="45" width="510" height="520"/><text class="n" x="530" y="32" text-anchor="middle">UPSTREAM PREDICTION MODULES</text>
  <rect class="box" x="310" y="90" width="215" height="72" fill="#E7DDF5"/><text class="t" x="418" y="119" text-anchor="middle">DeBERTa-v3-large</text><text class="s" x="418" y="144" text-anchor="middle">current-turn encoder</text>
  <rect class="box" x="565" y="90" width="180" height="72" fill="#F7D9E3"/><text class="t" x="655" y="119" text-anchor="middle">Binary head</text><text class="s" x="655" y="144" text-anchor="middle">p(confirm)</text>
  <path class="flow" d="M525 126 H565"/>

  <rect class="box" x="310" y="240" width="215" height="72" fill="#E7DDF5"/><text class="t" x="418" y="269" text-anchor="middle">DeBERTa-v3-large</text><text class="s" x="418" y="294" text-anchor="middle">current-turn encoder</text>
  <rect class="box" x="565" y="240" width="180" height="72" fill="#F7D9E3"/><text class="t" x="655" y="269" text-anchor="middle">7-label heads</text><text class="s" x="655" y="294" text-anchor="middle">p(category)</text>
  <path class="flow" d="M525 276 H565"/>

  <rect class="box" x="300" y="410" width="190" height="72" fill="#E7DDF5"/><text class="t" x="395" y="439" text-anchor="middle">Frozen DeBERTa</text><text class="s" x="395" y="464" text-anchor="middle">turn embeddings</text>
  <rect class="box" x="515" y="398" width="165" height="96" fill="#DDF2E1"/><text class="t" x="598" y="427" text-anchor="middle">Temporal</text><text class="s" x="598" y="451" text-anchor="middle">Transformer</text><text class="n" x="598" y="474" text-anchor="middle">2 layers, 8 heads, h=8</text>
  <rect class="box" x="700" y="410" width="70" height="72" fill="#F7D9E3"/><text class="s" x="735" y="439" text-anchor="middle">Binary</text><text class="s" x="735" y="461" text-anchor="middle">p(Alert)</text>
  <path class="flow" d="M490 446 H515"/><path class="flow" d="M680 446 H700"/>
  <path class="flow" d="M240 337 H265 V126 H310"/><path class="flow" d="M240 337 H270 V276 H310"/><path class="flow" d="M240 337 H265 V446 H300"/>

  <rect class="box" x="835" y="215" width="285" height="190" fill="#FFF0C7"/><text class="t" x="978" y="250" text-anchor="middle">Causal progression features</text><text class="s" x="978" y="280" text-anchor="middle">previous probabilities</text><text class="s" x="978" y="306" text-anchor="middle">rolling means and maxima</text><text class="s" x="978" y="332" text-anchor="middle">Alert → Confirm ordering</text><text class="s" x="978" y="358" text-anchor="middle">accumulation, escalation, volatility</text><text class="s" x="978" y="384" text-anchor="middle">category changes</text>
  <path class="flow" d="M745 126 H800 V250 H835"/><path class="flow" d="M745 276 H835"/><path class="flow" d="M770 446 H800 V370 H835"/>

  <rect class="group" x="1160" y="75" width="400" height="500"/><text class="n" x="1360" y="62" text-anchor="middle">SELECTED SAFETY-CONSTRAINED POLICY</text>
  <rect class="box" x="1195" y="135" width="175" height="80" fill="#FAD9B8"/><text class="t" x="1283" y="166" text-anchor="middle">Random forest</text><text class="s" x="1283" y="191" text-anchor="middle">learned level ℓ̂ ∈ {0,1,2,3}</text>
  <rect class="box" x="1195" y="325" width="175" height="80" fill="#F5C7C7"/><text class="t" x="1283" y="356" text-anchor="middle">Safety guardrails</text><text class="s" x="1283" y="381" text-anchor="middle">minimum level g</text>
  <rect class="box" x="1400" y="225" width="130" height="90" fill="#D5E8F6"/><text class="t" x="1465" y="255" text-anchor="middle">Final level</text><text class="s" x="1465" y="282" text-anchor="middle">max(ℓ̂, g)</text>
  <rect class="box" x="1375" y="405" width="180" height="115" fill="#D5E8F6"/><text class="t" x="1465" y="436" text-anchor="middle">Action + rationale</text><text class="s" x="1465" y="463" text-anchor="middle">continue | resources</text><text class="s" x="1465" y="488" text-anchor="middle">human defer | urgent</text>
  <path class="flow" d="M1120 275 H1140 V175 H1195"/><path class="flow" d="M1120 345 H1140 V365 H1195"/><path class="flow" d="M1370 175 H1385 V255 H1400"/><path class="flow" d="M1370 365 H1385 V290 H1400"/><path class="flow" d="M1465 315 V405"/>

  <rect class="box" x="835" y="535" width="245" height="75" fill="#EEEEEE" stroke-dasharray="8 6"/><text class="t" x="958" y="565" text-anchor="middle">Probability uncertainty</text><text class="s" x="958" y="591" text-anchor="middle">entropy, confidence, margin</text>
  <rect class="box" x="1115" y="535" width="190" height="75" fill="#EEEEEE" stroke-dasharray="8 6"/><text class="t" x="1210" y="565" text-anchor="middle">Policy ablation</text><text class="s" x="1210" y="591" text-anchor="middle">not selected</text>
  <path class="flow dash" d="M978 405 V535"/><path class="flow dash" d="M1080 572 H1115"/>
  <text class="n" x="1070" y="650" text-anchor="middle">Dashed gray branch was implemented and evaluated, but is not part of the final selected policy.</text>
  <text class="n" x="800" y="720" text-anchor="middle">Offline research architecture; escalation levels are policy outputs, not real emergency-service actions.</text>
</svg>

